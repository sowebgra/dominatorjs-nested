<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">
    <title>Hello World | Dominator.js</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            color: #f8fafc;
            background:
                radial-gradient(circle at 15% 15%, #1e3a5f 0, transparent 40%),
                radial-gradient(circle at 85% 85%, #164e63 0, transparent 35%),
                #101827;
        }

        body > div {
            width: min(100%, 680px);
            padding: 70px 35px;
            text-align: center;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 24px;
            background: linear-gradient(145deg, #1e293b, #111827);
            box-shadow: 0 30px 80px rgba(0,0,0,.35);
            animation: appear .7s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media(max-width:480px) {
            body > div {
                padding: 50px 20px;
            }
        }
    </style>
</head>

<body>

    <script src="dominator.min.js"></script>

    <script>
        D$({
            element: "div",
            text: "Hello World"
        });
    </script>

</body>
</html>
